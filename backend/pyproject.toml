[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Valentyn Bondarenko", email = "murica.it@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "pydantic-settings>=2.16.3",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.26",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --junitxml=../tests/reports/backend.xml -o junit_family=xunit1"

[tool.fastapi]
entrypoint = "backend.main:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
