name: travelradar

services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - travelradar-net
    restart: unless-stopped

  nifi:
    image: apache/nifi:2.0.0
    ports:
      - "8443:8443"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: travelradar123
      NIFI_JVM_HEAP_INIT: 1g
      NIFI_JVM_HEAP_MAX: 1g
    env_file:
      - path: nifi/.env
        required: false
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - nifi_state:/opt/nifi/nifi-current/state
    depends_on:
      - kafka
    networks:
      - travelradar-net
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 768mb --maxmemory-policy volatile-ttl
    volumes:
      - redis_data:/data
    networks:
      - travelradar-net
    restart: unless-stopped

  spark-master:
    build: ./spark
    image: travelradar-spark:3.5.3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_DAEMON_MEMORY: 512m
      HADOOP_USER_NAME: root
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark:/opt/spark/apps
      - ./hdfs/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./hdfs/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
      - spark_data:/opt/spark/work-dir
    networks:
      - travelradar-net
    restart: unless-stopped

  spark-worker:
    build: ./spark
    image: travelradar-spark:3.5.3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1g
      SPARK_DAEMON_MEMORY: 512m
      HADOOP_USER_NAME: root
    ports:
      - "8081:8081"
    volumes:
      - ./spark:/opt/spark/apps
      - ./hdfs/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./hdfs/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
      - spark_data:/opt/spark/work-dir
    depends_on:
      - spark-master
    networks:
      - travelradar-net
    restart: unless-stopped

  # Optional warehouse profile: docker compose --profile warehouse up -d
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    profiles: ["warehouse"]
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      CLUSTER_NAME: travelradar
      HDFS_CONF_dfs_replication: "1"
    env_file:
      - hdfs/hadoop.env
    volumes:
      - hdfs_namenode:/hadoop/dfs/name
      - ./hdfs/init-dirs.sh:/init-dirs.sh:ro
    networks:
      - travelradar-net
    restart: unless-stopped
    mem_limit: 768m

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    profiles: ["warehouse"]
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      HDFS_CONF_dfs_replication: "1"
    env_file:
      - hdfs/hadoop.env
    volumes:
      - hdfs_datanode:/hadoop/dfs/data
    depends_on:
      - namenode
    networks:
      - travelradar-net
    restart: unless-stopped
    mem_limit: 768m

  hdfs-init:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    profiles: ["warehouse"]
    env_file:
      - hdfs/hadoop.env
    volumes:
      - ./hdfs/init-dirs.sh:/init-dirs.sh:ro
    entrypoint: ["/bin/bash", "/init-dirs.sh"]
    depends_on:
      - namenode
      - datanode
    networks:
      - travelradar-net
    restart: "no"

networks:
  travelradar-net:

volumes:
  kafka_data:
  redis_data:
  spark_data:
  hdfs_namenode:
  hdfs_datanode:
  nifi_conf:
  nifi_database:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
  nifi_state:
