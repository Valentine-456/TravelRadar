name: travelradar

# Single-node TravelRadar stack: NiFi -> Kafka -> Spark -> Redis (hot) + HDFS/Hive (history).
# Sized for a Docker Desktop VM with 8 GB of memory. Start with:  docker compose up -d --build

x-hadoop-image: &hadoop-image apache/hive:4.0.1   # multi-arch (amd64 + arm64); ships Hadoop 3.3.6

services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Kafka is the replay buffer for the speed layer; the full history lives on HDFS.
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_COMPRESSION_TYPE: producer
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - travelradar-net
    restart: unless-stopped

  # One-shot: creates the topics (idempotent). Topic list: kafka/topics.txt
  kafka-init:
    image: apache/kafka:3.9.0
    entrypoint: ["/bin/bash", "/kafka/create-topics.sh"]
    volumes:
      - ./kafka:/kafka:ro
    depends_on:
      - kafka
    networks:
      - travelradar-net
    restart: "no"

  nifi:
    image: apache/nifi:2.0.0
    ports:
      - "8443:8443"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: travelradar123
      NIFI_JVM_HEAP_INIT: 768m
      NIFI_JVM_HEAP_MAX: 1g
    env_file:
      - path: nifi/.env
        required: false
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - nifi_state:/opt/nifi/nifi-current/state
    depends_on:
      - kafka
    networks:
      - travelradar-net
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-ttl
    volumes:
      - redis_data:/data
    networks:
      - travelradar-net
    restart: unless-stopped

  # ---- HDFS (batch layer storage). Same image as Hive, so it runs natively on arm64 and amd64.
  namenode:
    image: *hadoop-image
    hostname: namenode
    user: root
    entrypoint: ["/bin/bash", "/hdfs/start-namenode.sh"]
    environment:
      HADOOP_CONF_DIR: /hdfs/conf
      HDFS_NAMENODE_OPTS: -Xmx384m
    ports:
      - "9870:9870"
    volumes:
      - ./hdfs:/hdfs:ro
      - hdfs_namenode:/data/dfs/name
    networks:
      - travelradar-net
    restart: unless-stopped

  datanode:
    image: *hadoop-image
    hostname: datanode
    user: root
    entrypoint: ["hdfs", "datanode"]
    environment:
      HADOOP_CONF_DIR: /hdfs/conf
      HDFS_DATANODE_OPTS: -Xmx384m
    ports:
      - "9864:9864"
    volumes:
      - ./hdfs:/hdfs:ro
      - hdfs_datanode:/data/dfs/data
    depends_on:
      - namenode
    networks:
      - travelradar-net
    restart: unless-stopped

  # One-shot: creates the /travelradar directory tree (idempotent).
  hdfs-init:
    image: *hadoop-image
    user: root
    entrypoint: ["/bin/bash", "/hdfs/init-dirs.sh"]
    environment:
      HADOOP_CONF_DIR: /hdfs/conf
    volumes:
      - ./hdfs:/hdfs:ro
    depends_on:
      - namenode
      - datanode
    networks:
      - travelradar-net
    restart: "no"

  # HiveServer2 with an embedded metastore: SQL catalog over the Parquet files on HDFS.
  # All tables are EXTERNAL and recreated from hive/tables.sql on start, so the metastore holds no state.
  hive:
    image: *hadoop-image
    hostname: hive
    entrypoint: ["/bin/bash", "/hive/start-hive.sh"]
    environment:
      SERVICE_NAME: hiveserver2
      HADOOP_CONF_DIR: /hdfs/conf
      SERVICE_OPTS: >-
        -Xmx768m
        -Dhive.metastore.warehouse.dir=hdfs://namenode:9000/travelradar/warehouse
        -Dhive.server2.enable.doAs=false
        -Dhive.compute.query.using.stats=false
        -Dhive.msck.path.validation=ignore
      HIVE_SYNC_INTERVAL: 300
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./hdfs:/hdfs:ro
      - ./hive:/hive:ro
    depends_on:
      - namenode
      - datanode
    networks:
      - travelradar-net
    restart: unless-stopped

  spark-master:
    build: ./spark
    image: travelradar-spark:3.5.3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_DAEMON_MEMORY: 256m
      HADOOP_USER_NAME: root
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark:/opt/spark/apps
      - ./hdfs/conf/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./hdfs/conf/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
      - spark_data:/opt/spark/work-dir
    networks:
      - travelradar-net
    restart: unless-stopped

  spark-worker:
    build: ./spark
    image: travelradar-spark:3.5.3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 2304m   # pipeline (1 GB executor) + one batch job (1 GB) side by side
      SPARK_DAEMON_MEMORY: 256m
      HADOOP_USER_NAME: root
    ports:
      - "8081:8081"
    volumes:
      - ./spark:/opt/spark/apps
      - ./hdfs/conf/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./hdfs/conf/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
      - spark_data:/opt/spark/work-dir
    depends_on:
      - spark-master
    networks:
      - travelradar-net
    restart: unless-stopped

networks:
  travelradar-net:

volumes:
  kafka_data:
  redis_data:
  spark_data:
  hdfs_namenode:
  hdfs_datanode:
  nifi_conf:
  nifi_database:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
  nifi_state:
